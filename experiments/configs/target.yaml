# RP3 step 1 target: 64 queried + 16 updates + 16 distractors, 32 slots, train length 512.
# pilot.yaml with the settings that learned in pilot16: 2 layers, lr 3e-4.
n_train: 100000
n_val: 5000
n_test: 10000
data:
  vocab_size: 8192
  seq_len: 512
  num_kv_pairs: 64
  num_updates: 16
  num_distractors: 16
  power_a: 0.01
  min_delay: 0
model:
  d_model: 256
  n_layers: 2
  n_heads: 4
  slots: 32
  mem_dim: 128
  writer: controller
train:
  steps: 8000
  batch_size: 64
  lr: 3.0e-4
  warmup: 200
  eval_every: 500
  eval_batches: 10
eval_lengths: [1024, 2048]
