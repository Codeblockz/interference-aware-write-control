# RP2 pilot, small setting: 16 queried + 4 updates + 4 distractors (24 associations),
# 16 slots, train length 128, vocab 2048.
n_train: 100000
n_val: 5000
n_test: 10000
data:
  vocab_size: 2048
  seq_len: 128
  num_kv_pairs: 16
  num_updates: 4
  num_distractors: 4
  power_a: 0.01
  min_delay: 0
model:
  d_model: 256
  n_layers: 2
  n_heads: 4
  slots: 16
  mem_dim: 128
  writer: controller
train:
  steps: 4000
  batch_size: 64
  lr: 3.0e-4
  warmup: 200
  eval_every: 500
  eval_batches: 10
eval_lengths: [256, 512]
