# RP2 pilot: 64 associations, 32 slots, train length 512, one seed.
# Controller vs recency baseline. Establishes GPU memory and runtime.
n_train: 100000
n_val: 5000
n_test: 10000
data:
  vocab_size: 8192
  seq_len: 512
  num_kv_pairs: 64
  num_updates: 16
  num_distractors: 16
  power_a: 0.01
  min_delay: 0
model:
  d_model: 256
  n_layers: 4
  n_heads: 4
  slots: 32
  mem_dim: 128
  writer: controller
train:
  steps: 8000
  batch_size: 64
  lr: 1.0e-3
  warmup: 200
  eval_every: 500
  eval_batches: 10
eval_lengths: [1024, 2048]
